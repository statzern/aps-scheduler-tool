<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pain &amp; Periop Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F6F7F5; --surface:#FFFFFF; --surface-2:#EEF1EE;
  --ink:#1B231F; --ink-soft:#5B655F; --ink-faint:#8B948E;
  --line:#DCE1DC; --line-strong:#C3CAC3;
  --aps:#0E6E63; --aps-soft:#E3F1EE;
  --pcs:#A6631E; --pcs-soft:#F5EADA;
  --accent:#0E6E63; --accent-ink:#FFFFFF;
  --good:#2F7D4F; --good-soft:#E4F3E9;
  --warn:#B8862E; --warn-soft:#F7EEDC;
  --bad:#B23B3B; --bad-soft:#F8E6E6;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 4px 14px rgba(20,30,25,.05);
  --backdrop: rgba(20,30,25,.45);
  --radius: 10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10130F; --surface:#181D18; --surface-2:#1F251F;
    --ink:#E7EBE6; --ink-soft:#A9B2A7; --ink-faint:#71796F;
    --line:#2A302A; --line-strong:#3A423A;
    --aps:#4FD3C4; --aps-soft:#16302C;
    --pcs:#E3A459; --pcs-soft:#3A2A14;
    --accent:#4FD3C4; --accent-ink:#0B1210;
    --good:#6FCB93; --good-soft:#16301F;
    --warn:#E3C06B; --warn-soft:#362B14;
    --bad:#E28080; --bad-soft:#3A1717;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    --backdrop: rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#10130F; --surface:#181D18; --surface-2:#1F251F;
  --ink:#E7EBE6; --ink-soft:#A9B2A7; --ink-faint:#71796F;
  --line:#2A302A; --line-strong:#3A423A;
  --aps:#4FD3C4; --aps-soft:#16302C;
  --pcs:#E3A459; --pcs-soft:#3A2A14;
  --accent:#4FD3C4; --accent-ink:#0B1210;
  --good:#6FCB93; --good-soft:#16301F;
  --warn:#E3C06B; --warn-soft:#362B14;
  --bad:#E28080; --bad-soft:#3A1717;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --backdrop: rgba(0,0,0,.6);
}
*,*::before,*::after{ box-sizing:border-box; }
html{ color-scheme:light dark; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:14px; }
img{ max-width:100%; }
[hidden]{ display:none!important; }
h1,h2,h3{ font-family:'Fraunces',Georgia,serif; font-weight:600; text-wrap:balance; margin:0; color:var(--ink); }
.mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
button, input, select, textarea{ font-family:inherit; color:inherit; }
::selection{ background:var(--aps-soft); }
a{ color:var(--accent); }

.app{ max-width:1180px; margin:0 auto; padding:28px 24px 64px; }

.topbar{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
.brand{ display:flex; align-items:baseline; gap:10px; }
.brand h1{ font-size:26px; letter-spacing:-0.01em; }
.brand .sub{ color:var(--ink-soft); font-size:13px; }
.sync-status{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-faint); }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--good); flex:none; }
.dot.local{ background:var(--warn); }

.tabs{ display:flex; gap:2px; margin:22px 0 20px; border-bottom:1px solid var(--line); }
.tab{ appearance:none; background:none; border:none; padding:10px 16px; font-size:14px; font-weight:500; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s; }
.tab:hover{ color:var(--ink); }
.tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
.tab .count{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-left:5px; }

.panel[hidden]{ display:none!important; }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
.card + .card{ margin-top:16px; }
.card h2{ font-size:18px; margin-bottom:4px; }
.card .desc{ color:var(--ink-soft); font-size:13px; margin-bottom:16px; max-width:64ch; }

.grid-2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
@media(max-width:720px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); }
.field .hint{ font-size:12px; color:var(--ink-faint); }
.input, .select{ background:var(--bg); border:1px solid var(--line-strong); border-radius:7px; padding:9px 11px; font-size:14px; color:var(--ink); }
.input:focus, .select:focus, button:focus-visible, .seg-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.input[type="number"]{ font-family:'IBM Plex Mono',monospace; }

.row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.row.between{ justify-content:space-between; }
.row.gap-8{ gap:8px; }

.btn{ appearance:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); padding:9px 15px; border-radius:7px; font-size:13.5px; font-weight:500; cursor:pointer; transition:border-color .15s, background .15s; }
.btn:hover{ border-color:var(--ink-faint); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn-primary:hover{ filter:brightness(1.06); border-color:var(--accent); }
.btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
.btn-ghost{ background:none; border-color:transparent; color:var(--ink-soft); }
.btn-ghost:hover{ color:var(--ink); background:var(--surface-2); }
.btn-danger{ color:var(--bad); border-color:var(--bad-soft); }
.btn-danger:hover{ background:var(--bad-soft); }
.btn-sm{ padding:5px 10px; font-size:12.5px; border-radius:6px; }

.badge{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:20px; letter-spacing:.02em; }
.badge-aps{ background:var(--aps-soft); color:var(--aps); }
.badge-pcs{ background:var(--pcs-soft); color:var(--pcs); }
.badge-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

.pill{ font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px; }
.pill-good{ background:var(--good-soft); color:var(--good); }
.pill-warn{ background:var(--warn-soft); color:var(--warn); }
.pill-bad{ background:var(--bad-soft); color:var(--bad); }
.pill-neutral{ background:var(--surface-2); color:var(--ink-soft); }

.stat-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
@media(max-width:720px){ .stat-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; }
.stat .num{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:500; line-height:1.1; }
.stat .lbl{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

table{ width:100%; border-collapse:collapse; font-size:13.5px; }
th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); }
td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr:last-child td{ border-bottom:none; }
.table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); }
.table-wrap table{ min-width:560px; }
tr.unfilled td{ background:var(--bad-soft); }
tr.hoverable:hover td{ background:var(--surface-2); }
/* Wanted/Available cells in the schedule table — a name list (or "N wanted"
 * count once it's long) that doubles as a button opening the assign-from-
 * list modal; dotted underline hints it's clickable without looking like a
 * full button. */
.status-link{ appearance:none; border:none; background:none; padding:0; margin:0; font:inherit; color:inherit; cursor:pointer; text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--ink-faint); text-underline-offset:2px; text-align:left; }
.status-link:hover{ color:var(--accent); text-decoration-color:var(--accent); }

.people-list{ display:flex; flex-direction:column; gap:10px; }
.person-card{ display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 16px; }
.person-card .name{ font-weight:600; font-size:14.5px; }
.person-card .meta{ display:flex; gap:8px; align-items:center; margin-top:5px; flex-wrap:wrap; }
.person-card .meta span.small{ font-size:12px; color:var(--ink-soft); }

.editor{ margin-top:16px; border-top:1px dashed var(--line-strong); padding-top:16px; }

.modal-overlay{ position:fixed; inset:0; background:var(--backdrop); display:flex; align-items:flex-start; justify-content:center; padding:5vh 20px; z-index:200; overflow-y:auto; }
.modal-overlay[hidden]{ display:none!important; }
.modal-dialog{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); max-width:660px; width:100%; padding:24px; margin-bottom:5vh; }
.modal-dialog.modal-wide{ max-width:1040px; }
@media(max-width:720px){ .modal-overlay{ padding:0; align-items:stretch; } .modal-dialog{ max-width:none; border-radius:0; min-height:100%; margin-bottom:0; } }
/* 220px + minmax(0,1fr) rather than the old 280px + 1fr: a bare "1fr" track
 * never shrinks below its content's width, so a wide sheet used to push the
 * preview (and the whole modal) past the viewport edge; minmax(0,1fr) lets
 * the column shrink to the available space and hand overflow to
 * .xlsx-preview's own scrollbar instead. The narrower fixed column also
 * keeps the file list from crowding out the sheet itself. */
.uploads-layout{ display:grid; grid-template-columns:220px minmax(0,1fr); gap:16px; align-items:start; min-width:0; }
@media(max-width:720px){ .uploads-layout{ grid-template-columns:1fr; } }
.uploads-list{ max-height:60vh; overflow-y:auto; border:1px solid var(--line); border-radius:9px; background:var(--bg); }
.upload-row{ display:block; width:100%; text-align:left; border:none; background:none; padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line); font-family:inherit; color:inherit; overflow-wrap:anywhere; }
.upload-row:last-child{ border-bottom:none; }
.upload-row:hover{ background:var(--surface-2); }
.upload-row.active{ background:var(--aps-soft); }
.upload-row .name{ font-weight:600; font-size:13px; }
.upload-row .meta{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
.uploads-detail{ min-width:0; overflow-wrap:anywhere; }
.xlsx-preview{ overflow:auto; max-height:56vh; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:8px; }
.xlsx-preview table{ border-collapse:collapse; font-size:12.5px; }
.xlsx-preview td, .xlsx-preview th{ border:1px solid var(--line); padding:4px 8px; white-space:nowrap; color:var(--ink); }
.month-group{ margin-bottom:14px; }
.month-header{ font-size:12px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; padding:8px 4px 6px; position:sticky; top:0; background:var(--surface); }
.block-list{ max-height:420px; overflow-y:auto; border:1px solid var(--line); border-radius:9px; background:var(--bg); padding:4px 10px; }
.block-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px 4px; border-bottom:1px solid var(--line); }
.block-row:last-child{ border-bottom:none; }
.block-row .dates{ font-size:13px; flex:1 1 220px; min-width:160px; }
.block-row .dates .pc{ color:var(--ink-faint); font-size:11.5px; display:block; margin-top:1px; }
.block-row-controls{ flex:0 0 auto; }
.block-row-controls .segmented{ width:100%; }
.block-row-controls .seg-btn{ flex:1; text-align:center; padding:7px 10px; }
.block-row-comment{ flex:1 1 100%; }
.block-row-comment .input{ width:100%; padding:6px 9px; font-size:12.5px; }
.period-banner{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn); border-radius:var(--radius); padding:10px 16px; margin-bottom:16px; font-size:13.5px; font-weight:500; }
.comment-marker{ box-shadow:inset 0 -2px 0 var(--accent); }
.block-row-flagged{ background:var(--warn-soft); border-radius:6px; }

.segmented{ display:inline-flex; border:1px solid var(--line-strong); border-radius:7px; overflow:hidden; flex:none; }
.seg-btn{ appearance:none; border:none; background:var(--surface); color:var(--ink-soft); padding:6px 10px; font-size:12px; font-weight:500; cursor:pointer; border-left:1px solid var(--line-strong); }
.seg-btn:first-child{ border-left:none; }
.seg-btn.active{ background:var(--surface-2); color:var(--ink); }
.seg-btn.active[data-v="requested"]{ background:var(--aps-soft); color:var(--aps); }
.seg-btn.active[data-v="unavailable"]{ background:var(--bad-soft); color:var(--bad); }
.seg-btn.active[data-v="neutral"]{ background:var(--surface-2); color:var(--ink); }

.checkbox-row{ display:flex; align-items:center; gap:7px; font-size:13.5px; }
.checkbox-row input{ width:15px; height:15px; accent-color:var(--accent); }

.empty-state{ text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:13.5px; }
.empty-state strong{ color:var(--ink-soft); display:block; margin-bottom:4px; font-size:14px;}

.chip-row{ display:flex; flex-wrap:wrap; gap:5px; }

.filter-group-label{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:6px; }
.cal-grid-wrap{ overflow:auto; max-height:72vh; border-radius:var(--radius); }
.cal-grid{ border-collapse:separate; border-spacing:0; font-size:12.5px; }
.cal-grid th, .cal-grid td{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:7px 10px; text-align:center; }
.cal-corner{ position:sticky; left:0; top:0; z-index:3; background:var(--surface); }
.cal-person-head{ position:sticky; top:0; z-index:2; background:var(--surface); font-weight:600; text-align:left; white-space:nowrap; }
.cal-week-head{ position:sticky; left:0; z-index:1; background:var(--surface); text-align:left; white-space:nowrap; }
.cal-cell{ cursor:pointer; font-size:15px; min-width:34px; user-select:none; }
.cal-cell:hover{ background:var(--surface-2); }
.cal-cell-na{ color:var(--ink-faint); cursor:default; background:var(--bg); }
.cal-cell-requested{ color:var(--aps); font-weight:700; background:var(--aps-soft); }
.cal-cell-unavailable{ color:var(--bad); font-weight:700; background:var(--bad-soft); }
.cal-cell-neutral{ color:var(--line-strong); }
.cal-cell-dim{ opacity:.22; }
.chip{ font-size:11px; padding:2px 7px; border-radius:5px; background:var(--surface-2); color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }

.toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:8px; font-size:13px; box-shadow:var(--shadow); z-index:50; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

details.advanced summary{ cursor:pointer; font-size:13px; font-weight:600; color:var(--ink-soft); padding:4px 0; }
details.advanced[open] summary{ margin-bottom:10px; }

details.filter-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 20px; box-shadow:var(--shadow); }
details.filter-card summary{ cursor:pointer; font-weight:600; font-size:14px; list-style:none; display:flex; align-items:center; gap:7px; }
details.filter-card summary::-webkit-details-marker{ display:none; }
details.filter-card summary::before{ content:'▸'; display:inline-block; font-size:11px; color:var(--ink-soft); transition:transform .15s; }
details.filter-card[open] summary::before{ transform:rotate(90deg); }
details.filter-card[open] summary{ margin-bottom:14px; }
details.filter-card .filter-count{ font-weight:400; color:var(--ink-soft); font-size:12.5px; }

.footer-note{ margin-top:30px; font-size:12px; color:var(--ink-faint); text-align:center; }
@media (prefers-reduced-motion: reduce){ *{ transition:none!important; } }

.auth-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.auth-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px; }
.auth-card h1{ font-size:22px; margin-bottom:4px; }
.auth-card .sub{ color:var(--ink-soft); font-size:13px; margin-bottom:20px; }
.auth-error{ background:var(--bad-soft); color:var(--bad); border-radius:7px; padding:8px 11px; font-size:13px; margin-bottom:12px; }
.auth-tabs{ display:flex; gap:4px; margin-bottom:18px; background:var(--surface-2); border-radius:8px; padding:3px; }
.auth-tab{ flex:1; text-align:center; padding:7px 0; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft); border:none; background:none; }
.auth-tab.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
.role-badge{ font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em; }
.role-badge.admin{ background:var(--aps-soft); color:var(--aps); }
.role-badge.staff{ background:var(--surface-2); color:var(--ink-soft); }
</style>
</head>
<body>

<div id="authScreen" class="auth-screen" hidden>
  <div class="auth-card">
    <h1>Pain &amp; Periop Scheduler</h1>
    <div class="sub">Sign in to view or submit your rotation requests.</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="authTabSignin" type="button">Sign in</button>
      <button class="auth-tab" id="authTabSignup" type="button">Create account</button>
    </div>
    <div id="authError" class="auth-error" hidden></div>
    <div class="field" style="margin-bottom:12px;"><label for="authEmail">Email</label><input class="input" type="email" id="authEmail" autocomplete="email"></div>
    <div class="field" style="margin-bottom:16px;"><label for="authPassword">Password</label><input class="input" type="password" id="authPassword" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="authSubmit" style="width:100%;">Sign in</button>
    <div class="row between" style="margin-top:12px;">
      <button class="btn-ghost" id="authForgot" style="border:none;background:none;cursor:pointer;color:var(--ink-soft);font-size:12.5px;font-family:inherit;padding:0;">Forgot password?</button>
      <span class="hint" id="authHint"></span>
    </div>
  </div>
</div>

<div id="loadingScreen" class="auth-screen" hidden>
  <div class="auth-card" id="loadingCard" style="text-align:center;"></div>
</div>

<div class="app" hidden>
  <div class="topbar">
    <div class="brand">
      <h1>Pain &amp; Periop Scheduler</h1>
      <span class="sub">APS &amp; PCS rotation planning</span>
    </div>
    <div class="sync-status">
      <span class="role-badge" id="roleBadge"></span>
      <select class="select" id="periodSelect" hidden style="flex:none;font-size:12.5px;padding:6px 8px;"></select>
      <div class="segmented" id="viewToggle" hidden style="flex:none;">
        <button class="seg-btn" data-view="admin">Admin view</button>
        <button class="seg-btn" data-view="staff">My view</button>
      </div>
      <span id="whoami"></span>
      <button class="btn btn-ghost btn-sm" id="btnSignOut">Sign out</button>
    </div>
  </div>

  <div id="periodBanner" class="period-banner" hidden>
    <span id="periodBannerText"></span>
    <button class="btn btn-sm" id="btnBackToCurrent">Back to current period</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="setup" data-admin-only role="tab">Setup</button>
    <button class="tab" data-tab="roster" role="tab"><span id="rosterTabLabel">Roster &amp; Requests</span> <span class="count" id="rosterCount"></span></button>
    <button class="tab" data-tab="schedule" role="tab">Schedule</button>
    <button class="tab" data-tab="report" role="tab">Report</button>
  </div>

  <div id="panel-setup" class="panel"></div>
  <div id="panel-roster" class="panel" hidden></div>
  <div id="panel-schedule" class="panel" hidden></div>
  <div id="panel-report" class="panel" hidden></div>

  <div class="footer-note" id="footerNote"></div>
</div>

<div class="modal-overlay" id="personModalOverlay" hidden>
  <div class="modal-dialog" id="personModalDialog" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, sendPasswordResetEmail

/** Pure: turns any config (live or an archived period's) into its list of
 * rotation blocks. Shared by rebuildBlocks() for the live config and by
 * currentViewContext() when an admin is browsing an archived period. */
function computeBlocksForConfig(config){
  const start = parseDateInput(config.startDate);
  const end = parseDateInput(config.endDate);
  const holidays = config.holidays||[];
  const blocks=[];
  if(start && end && end>=start){
    let d = firstWeekdayOnOrAfter(start,5); // Friday
    while(d<=end){ blocks.push(makeBlock('APS', d, holidays)); d=addDays(d,7); }
    let d2 = firstWeekdayOnOrAfter(start,6); // Saturday
    while(d2<=end){ blocks.push(makeBlock('PCS', d2, holidays)); d2=addDays(d2,7); }
  }
  blocks.sort((a,b)=> a.start-b.start || a.service.localeCompare(b.service));
  blocks.forEach((b,i)=>b.index=i);
  return blocks;
}
function rebuildBlocks(){
  const blocks = computeBlocksForConfig(state.config);
  state.blocks = blocks;
  state.conflicts = buildConflicts(blocks, Number(state.config.restDays)||0, !!state.config.noBackToBack);
}
/** nth (1-4) occurrence of a weekday (0=Sun..6=Sat) in a given month (0-indexed). */
function nthWeekdayOfMonth(year,month,weekday,n){
  let d = ymd(year,month,1), count=0;
  while(true){ if(d.getDay()===weekday){ count++; if(count===n) return d; } d = addDays(d,1); }
}
function lastWeekdayOfMonth(year,month,weekday){
  let d = ymd(year,month+1,0); // last calendar day of the month
  while(d.getDay()!==weekday) d = addDays(d,-1);
  return d;
}
function standardHolidaysForYear(year){
  return [
    { date: isoDate(ymd(year,0,1)), label:"New Year's Day" },
    { date: isoDate(nthWeekdayOfMonth(year,0,1,3)), label:'MLK Day' },
    { date: isoDate(lastWeekdayOfMonth(year,4,1)), label:'Memorial Day' },
    { date: isoDate(ymd(year,6,4)), label:'July 4th' },
    { date: isoDate(nthWeekdayOfMonth(year,8,1,1)), label:'Labor Day' },
    { date: isoDate(nthWeekdayOfMonth(year,10,4,4)), label:'Thanksgiving' },
    { date: isoDate(ymd(year,11,25)), label:'Christmas' },
  ];
}
/** Adds New Year's, MLK, Memorial Day, July 4th, Labor Day, Thanksgiving, and
 * Christmas for every year the current Setup date range touches. Returns how
 * many new dates were added (skips ones already on the list). */
function addStandardHolidays(){
  const start = parseDateInput(state.config.startDate), end = parseDateInput(state.config.endDate);
  if(!start || !end) return 0;
  const years = new Set();
  for(let y=start.getFullYear(); y<=end.getFullYear(); y++) years.add(y);
  let added = 0;
  for(const y of years){
    for(const h of standardHolidaysForYear(y)){
      if(!state.config.holidays.some(x=>x.date===h.date)){ state.config.holidays.push(h); added++; }
    }
  }
  return added;
}
function isHoliday(dateStr, holidays){ return holidays.some(h=>h.date===dateStr); }
function isWeekendOrHoliday(d, holidays){ const dow=d.getDay(); return dow===0 || dow===6 || isHoliday(isoDate(d), holidays); }
/** If a post-call day lands on a weekend or a configured holiday, push it forward
 * to the next day that is neither — matches the "post-call gets moved" convention
 * (a holiday Friday moves to the following Monday; a holiday Monday moves to Tuesday). */
function adjustPostcall(rawPostcall, holidays){
  let d = rawPostcall;
  while(isWeekendOrHoliday(d, holidays)) d = addDays(d,1);
  return d;
}
function makeBlock(service,start,holidays){
  const end = addDays(start,6);
  const rawPostcall = service==='APS' ? addDays(start,7) : addDays(start,9);
  const postcall = adjustPostcall(rawPostcall, holidays);
  const postcallShifted = isoDate(postcall)!==isoDate(rawPostcall);
  let holidayWeek = false;
  for(let d=start; d<=end; d=addDays(d,1)){ if(isHoliday(isoDate(d), holidays)){ holidayWeek=true; break; } }
  return { key:`${service}-${isoDate(start)}`, service, start, end, rawPostcall, postcall, postcallShifted, holidayWeek };
}
function buildConflicts(blocks, restDays, noBackToBack){
  const map = new Map(blocks.map(b=>[b.key,new Set()]));
  const byService = { APS:blocks.filter(b=>b.service==='APS'), PCS:blocks.filter(b=>b.service==='PCS') };
  for(let i=0;i<blocks.length;i++){
    for(let j=i+1;j<blocks.length;j++){
      const a=blocks[i], b=blocks[j];
      const gapDays = (b.start-a.postcall)/86400000;
      let conflict = gapDays < restDays;
      if(!conflict && noBackToBack && a.service===b.service){
        const between = byService[a.service].some(x=>x.start>a.start && x.start<b.start);
        if(!between) conflict = true;
      }
      if(conflict){ map.get(a.key).add(b.key); map.get(b.key).add(a.key); }
    }
  }
  return map;
}

function mulberry32(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function isEligible(p,b){
  if(!p.services.includes(b.service)) return false;
  const st = p.blockStatus[b.key];
  if(st==='unavailable') return false;
  if(p.restrictToRequested && st!=='requested') return false;
  return true;
}
function isFeasible(personId,b,personBlocks,conflicts){
  const mine = personBlocks.get(personId);
  const conf = conflicts.get(b.key);
  for(const k of mine) if(conf.has(k)) return false;
  return true;
}
/** Count of a person's assigned blockKeys belonging to one service. Keys are
 * always formatted "SERVICE-YYYY-MM-DD", so a prefix check is exact. */
function countForService(keySet, service){
  let n=0; const prefix = service+'-';
  for(const k of keySet) if(k.startsWith(prefix)) n++;
  return n;
}
function scoreState(assignment, personBlocks, blocks, people, weights){
  let score=0;
  for(const b of blocks) if(!assignment.get(b.key)) score -= weights.unfilled;
  for(const p of people){
    const mine = personBlocks.get(p.id);
    let reqSat=0;
    for(const k of mine) if(p.blockStatus[k]==='requested') reqSat++;
    score += reqSat*weights.request;
    for(const service of p.services){
      const target = p.targetWeeks[service];
      if(target!=null) score -= Math.abs(countForService(mine,service)-target)*weights.target;
    }
  }
  return score;
}
function cloneAssignState(assignment, personBlocks){
  const a = new Map(assignment);
  const pb = new Map(); for(const [k,v] of personBlocks) pb.set(k,new Set(v));
  return {assignment:a, personBlocks:pb};
}
function applyAssign(assignment,personBlocks,b,newP){
  const old = assignment.get(b.key);
  if(old) personBlocks.get(old).delete(b.key);
  assignment.set(b.key, newP);
  if(newP) personBlocks.get(newP).add(b.key);
}

/** locks: plain object blockKey->personId. Locked blocks are seeded into the
 * assignment up front and then never touched by construction or annealing —
 * they still occupy that person's schedule for conflict-checking purposes. */
function constructGreedy(blocks, people, conflicts, weights, seed, locks){
  const rng = mulberry32(seed*7919+13);
  const assignment = new Map(); const personBlocks = new Map(people.map(p=>[p.id,new Set()]));
  for(const b of blocks){
    const lockedId = locks[b.key];
    if(lockedId && personBlocks.has(lockedId)){ assignment.set(b.key, lockedId); personBlocks.get(lockedId).add(b.key); }
  }
  for(const b of blocks){
    if(assignment.has(b.key)) continue; // locked — already fixed above
    const cands = people.filter(p=> isEligible(p,b) && isFeasible(p.id,b,personBlocks,conflicts));
    if(cands.length===0){ assignment.set(b.key,null); continue; }
    let bestP=null,bestVal=-Infinity;
    for(const p of cands){
      let val=0;
      if(p.blockStatus[b.key]==='requested') val += weights.request;
      const mine = personBlocks.get(p.id);
      const target = p.targetWeeks[b.service];
      const countThisService = countForService(mine, b.service);
      val += (target!=null ? (target-countThisService) : -countThisService*0.3) * weights.target;
      val += rng()*0.75;
      if(val>bestVal){ bestVal=val; bestP=p; }
    }
    assignment.set(b.key, bestP.id);
    personBlocks.get(bestP.id).add(b.key);
  }
  return {assignment, personBlocks};
}

function anneal(state0, blocks, people, conflicts, weights, iterations, seed, locks){
  const rng = mulberry32(seed*104729+7);
  let {assignment, personBlocks} = state0;
  let current = scoreState(assignment, personBlocks, blocks, people, weights);
  let best = cloneAssignState(assignment,personBlocks); let bestScore = current;
  const T0=12, T1=0.03;
  const freeBlocks = blocks.filter(b=>!locks[b.key]);
  const unfilledKeys = ()=> freeBlocks.filter(b=>!assignment.get(b.key));
  if(freeBlocks.length===0) return best; // everything is locked — nothing for the solver to do
  for(let i=0;i<iterations;i++){
    const T = T0*Math.pow(T1/T0, i/Math.max(1,iterations-1));
    const uf = unfilledKeys();
    const b = (uf.length && rng()<0.45) ? uf[Math.floor(rng()*uf.length)] : freeBlocks[Math.floor(rng()*freeBlocks.length)];
    if(rng()<0.6){
      // reassign move
      const oldP = assignment.get(b.key);
      applyAssign(assignment,personBlocks,b,null);
      const cands = people.filter(p=> p.id!==oldP && isEligible(p,b) && isFeasible(p.id,b,personBlocks,conflicts));
      const pool = cands.slice(); if(oldP===null) pool.push(null);
      if(pool.length===0){ applyAssign(assignment,personBlocks,b,oldP); continue; }
      const newP = pool[Math.floor(rng()*pool.length)];
      applyAssign(assignment,personBlocks,b,newP);
      const ns = scoreState(assignment, personBlocks, blocks, people, weights);
      const delta = ns-current;
      if(delta>=0 || rng()<Math.exp(delta/T)){ current=ns; if(ns>bestScore){bestScore=ns; best=cloneAssignState(assignment,personBlocks);} }
      else{ applyAssign(assignment,personBlocks,b,oldP); }
    } else {
      // swap move — only between two free (unlocked) blocks
      const assignedBlocks = freeBlocks.filter(x=>assignment.get(x.key));
      if(assignedBlocks.length<2) continue;
      const b1 = assignedBlocks[Math.floor(rng()*assignedBlocks.length)];
      const b2 = assignedBlocks[Math.floor(rng()*assignedBlocks.length)];
      if(b1.key===b2.key) continue;
      const p1=assignment.get(b1.key), p2=assignment.get(b2.key);
      if(p1===p2) continue;
      applyAssign(assignment,personBlocks,b1,null); applyAssign(assignment,personBlocks,b2,null);
      const p1obj=people.find(p=>p.id===p1), p2obj=people.find(p=>p.id===p2);
      const ok1 = isEligible(p1obj,b2) && isFeasible(p1,b2,personBlocks,conflicts);
      const ok2 = isEligible(p2obj,b1) && isFeasible(p2,b1,personBlocks,conflicts);
      if(!ok1 || !ok2){ applyAssign(assignment,personBlocks,b1,p1); applyAssign(assignment,personBlocks,b2,p2); continue; }
      applyAssign(assignment,personBlocks,b1,p2); applyAssign(assignment,personBlocks,b2,p1);
      const ns = scoreState(assignment, personBlocks, blocks, people, weights);
      const delta = ns-current;
      if(delta>=0 || rng()<Math.exp(delta/T)){ current=ns; if(ns>bestScore){bestScore=ns; best=cloneAssignState(assignment,personBlocks);} }
      else{ applyAssign(assignment,personBlocks,b1,p1); applyAssign(assignment,personBlocks,b2,p2); }
    }
  }
  return best;
}

function runSolver(){
  const blocks = state.blocks, people = state.people, conflicts = state.conflicts;
  const weights = state.config.weights;
  const locks = state.locks;
  if(blocks.length===0 || people.length===0) return null;
  const iterations = Math.min(9000, Math.max(1500, blocks.length*people.length*12));
  let bestOverall=null, bestScore=-Infinity;
  const restarts = 5;
  for(let r=0;r<restarts;r++){
    let s = constructGreedy(blocks, people, conflicts, weights, r+1, locks);
    s = anneal(s, blocks, people, conflicts, weights, iterations, r+1, locks);
    const sc = scoreState(s.assignment, s.personBlocks, blocks, people, weights);
    if(sc>bestScore){ bestScore=sc; bestOverall=s; }
  }
  const assignment = {};
  for(const b of blocks) assignment[b.key] = bestOverall.assignment.get(b.key) || null;
  return { assignment, score: bestScore };
}

/** Explains why a week is unfilled — actually checks each eligible person's
 * current assignments against this week's conflict set (state.conflicts)
 * rather than assuming a conflict is the reason just because the week is
 * empty; the solver's randomized search can also just leave a fillable
 * week unfilled, especially with a lot of manual pins in play. */
function unfilledReason(b){
  const eligible = state.people.filter(p=>isEligible(p,b));
  if(eligible.length===0) return 'No one on the roster is eligible for this week (service, availability, or restrict-to-requested).';
  const conflictKeys = state.conflicts ? state.conflicts.get(b.key) : null;
  const blocked = conflictKeys && conflictKeys.size
    ? eligible.filter(p=>[...conflictKeys].some(k=>effectiveAssignment(k)===p.id))
    : [];
  if(blocked.length===eligible.length) return 'Everyone eligible already has a conflicting assignment within the rest window.';
  return 'Eligible people are free for this week, but the solver left it unfilled — try Regenerate, or assign someone manually.';
}

}

/** extra: controls markup (e.g. the Available/Requested/Unavailable segmented
 * control) shown to the right of the dates. comment: when given, renders an
 * editable free-text note on its own full-width line below — used wherever a
 * person can annotate a week regardless of its status (see the comment-input
 * wiring in renderMyRequests/renderPersonModal). */
/** flagged: highlights the row and adds a "check this" pill — used right
 * after attaching/replacing a request file in the person modal, for weeks
 * whose answer text couldn't be confidently read as yes/no (see the file
 * input wiring in renderPersonModal). */
function blockRowHtml(b, extra, comment, flagged){
  const pcNote = b.postcallShifted
    ? ` <span class="pill pill-warn" title="Normally ${fmtShort(b.rawPostcall)} — moved off a weekend/holiday">moved from ${fmtShort(b.rawPostcall)}</span>`
    : '';
  return `<div class="block-row${flagged?' block-row-flagged':''}">
    <span class="badge badge-${b.service.toLowerCase()}"><span class="badge-dot"></span>${b.service}</span>
    <span class="dates">${fmtShort(b.start)} – ${fmtShort(b.end)}<span class="pc">Post-call ${fmtShort(b.postcall)}${pcNote}</span></span>
    ${b.holidayWeek?'<span class="pill pill-neutral">Holiday week</span>':''}
    ${flagged?'<span class="pill pill-warn">check this</span>':''}
    ${extra?`<div class="block-row-controls">${extra}</div>`:''}
    ${comment!==undefined?`<div class="block-row-comment"><input class="input" type="text" maxlength="500" data-comment-key="${b.key}" placeholder="Add a comment (optional)" value="${esc(comment)}"></div>`:''}
  </div>`;
}
function groupByMonth(blocks){
  const map = new Map();
  for(const b of blocks){ const k=monthKey(b.start); if(!map.has(k)) map.set(k,{label:monthLabel(b.start),items:[]}); map.get(k).items.push(b); }
  return [...map.values()];
}

/** Lazily creates (or resets, if the signed-in person changed) the filter
 * state for My Requests — defaults to that person's own services, since
 * showing a service-filter checkbox for a service they don't cover would
 * be pointless. */
function ensureMyRequestsFilters(person){
  if(!state.myRequestsFilters || state.myRequestsFilters.personId!==person.id){
    const services = {}; person.services.forEach(s=>services[s]=true);
    state.myRequestsFilters = { personId:person.id, services, statuses:{neutral:true, requested:true, unavailable:true}, holidaysOnly:false, uiOpen:true };
  }
  return state.myRequestsFilters;
}
function renderMyRequests(){
  const el = document.getElementById('panel-roster');
  document.getElementById('rosterTabLabel').textContent = 'My Requests';
  document.getElementById('rosterCount').textContent = '';
  const ctx = currentViewContext();
  const person = ctx.editable ? state.auth.myPerson : ctx.people.find(p=>p.email && p.email===myEmail());
  if(!person){
    if(ctx.editable) renderOnboarding(el);
    else el.innerHTML = `<div class="card"><div class="empty-state">You weren't on the roster for this archived period.</div></div>`;
    return;
  }
  const editable = ctx.editable && isEditingOpen();
  const savedComments = ctx.comments[person.id] || {};
  const draftKey = person.id + (ctx.editable ? '' : ':' + (state.viewingPeriod && state.viewingPeriod.id));
  if(!state.myRequestsDraft || state.myRequestsDraft.key!==draftKey){
    state.myRequestsDraft = { key:draftKey, id:person.id, blockStatus:{...person.blockStatus}, targetWeeks:{...person.targetWeeks}, comments:{...savedComments} };
  }
  const draft = state.myRequestsDraft;
  const f = ensureMyRequestsFilters(person);
  const allRelevant = ctx.blocks.filter(b=>person.services.includes(b.service));
  const filteredBlocks = allRelevant.filter(b=>{
    if(!f.services[b.service]) return false;
    if(f.holidaysOnly && !b.holidayWeek) return false;
    const st = draft.blockStatus[b.key] || 'neutral';
    return f.statuses[st];

  const groups = groupByMonth(filteredBlocks);
  el.innerHTML = `
    ${!editable && ctx.editable ? `<div class="period-banner"><span>Requests are closed for this period — your admin can still make changes on your behalf.</span></div>` : ''}
    <div class="card">
      <h2>My requests — ${esc(person.name)}</h2>
      <div class="desc">Mark which weeks you want or can't do, add an optional note, and set your target week count per service. Your admin handles your name, services, and everything else about your profile.</div>
      <div class="grid-2">
        ${person.services.includes('APS')?`<div class="field"><label for="myTargetAPS">APS target weeks (optional)</label><input class="input" type="number" min="0" id="myTargetAPS" ${editable?'':'disabled'} value="${draft.targetWeeks.APS==null?'':draft.targetWeeks.APS}"></div>`:''}
        ${person.services.includes('PCS')?`<div class="field"><label for="myTargetPCS">PCS target weeks (optional)</label><input class="input" type="number" min="0" id="myTargetPCS" ${editable?'':'disabled'} value="${draft.targetWeeks.PCS==null?'':draft.targetWeeks.PCS}"></div>`:''}
      </div>
      ${person.restrictToRequested?'<div class="hint" style="margin-top:10px;">Your admin has set you to only be scheduled on weeks marked Requested below.</div>':''}
    </div>
    ${allRelevant.length===0 ? `<div class="card" style="margin-top:16px;"><div class="empty-state">No weeks are set up yet — check back once your admin sets the rotation window.</div></div>` : `
    <details class="filter-card" id="myReqFilterDetails" style="margin-top:16px;" ${f.uiOpen?'open':''}>
      <summary>Filters <span class="filter-count">— ${filteredBlocks.length} of ${allRelevant.length} week(s) shown</span></summary>
      <div class="row gap-8" style="flex-wrap:wrap;align-items:flex-start;">
        ${person.services.length>1?`<div>
          <div class="filter-group-label">Service</div>
          <div class="row gap-8">
            <label class="checkbox-row"><input type="checkbox" id="mrfAPS" ${f.services.APS?'checked':''}> APS</label>
            <label class="checkbox-row"><input type="checkbox" id="mrfPCS" ${f.services.PCS?'checked':''}> PCS</label>
          </div>
        </div>`:''}
        <div>
          <div class="filter-group-label">Status</div>
          <div class="row gap-8">
            <label class="checkbox-row"><input type="checkbox" id="mrfAvail" ${f.statuses.neutral?'checked':''}> Available</label>
            <label class="checkbox-row"><input type="checkbox" id="mrfReq" ${f.statuses.requested?'checked':''}> Requested</label>
            <label class="checkbox-row"><input type="checkbox" id="mrfUnavail" ${f.statuses.unavailable?'checked':''}> Unavailable</label>
          </div>
        </div>
        <div>
          <div class="filter-group-label">Weeks</div>
          <label class="checkbox-row"><input type="checkbox" id="mrfHolidays" ${f.holidaysOnly?'checked':''}> Holiday weeks only</label>
        </div>
      </div>
    </details>
    <div class="card" style="margin-top:16px;">
      ${filteredBlocks.length===0 ? `<div class="empty-state">No weeks match these filters.</div>` : `
      <div class="row between" style="margin-bottom:8px;">
        <strong style="font-size:13px;">Weeks (${filteredBlocks.length})</strong>
        <span class="hint">Available (default) · Requested · Unavailable</span>
      </div>
      <div class="block-list" style="max-height:520px;">
        ${groups.map(g=>`<div class="month-header">${g.label}</div>${g.items.map(b=>{
          const st = draft.blockStatus[b.key] || 'neutral';
          const seg = `<div class="segmented" data-key="${b.key}">
            <button class="seg-btn ${st==='neutral'?'active':''}" data-v="neutral" ${editable?'':'disabled'}>Available</button>
            <button class="seg-btn ${st==='requested'?'active':''}" data-v="requested" ${editable?'':'disabled'}>Requested</button>
            <button class="seg-btn ${st==='unavailable'?'active':''}" data-v="unavailable" ${editable?'':'disabled'}>Unavailable</button>
          </div>`;
          return blockRowHtml(b, seg, draft.comments[b.key]||'');
        }).join('')}`).join('')}
      </div>`}
      ${editable ? `<div class="row" style="margin-top:16px;">
        <button class="btn btn-primary" id="btnSaveMyRequests">Save my requests</button>
      </div>` : ''}
    </div>`}

  const filterDetails = document.getElementById('myReqFilterDetails');
  if(filterDetails){
    filterDetails.addEventListener('toggle', e=>{ f.uiOpen = e.target.open; });
    const bindFilter = (id, apply)=>{ const elm=document.getElementById(id); if(elm) elm.onchange = e=>{ apply(e.target.checked); renderMyRequests(); }; };
    bindFilter('mrfAPS', v=>f.services.APS=v);
    bindFilter('mrfPCS', v=>f.services.PCS=v);
    bindFilter('mrfAvail', v=>f.statuses.neutral=v);
    bindFilter('mrfReq', v=>f.statuses.requested=v);
    bindFilter('mrfUnavail', v=>f.statuses.unavailable=v);
    bindFilter('mrfHolidays', v=>f.holidaysOnly=v);
  }
  if(editable){
    el.querySelectorAll('.segmented').forEach(seg=>{
      seg.querySelectorAll('.seg-btn').forEach(btn=> btn.onclick = ()=>{
        const key = seg.dataset.key, v = btn.dataset.v;
        if(v==='neutral') delete draft.blockStatus[key]; else draft.blockStatus[key]=v;
        if(!f.statuses[v]){ renderMyRequests(); return; } // this row no longer matches the status filter — re-render to drop it
        seg.querySelectorAll('.seg-btn').forEach(b2=>b2.classList.toggle('active', b2.dataset.v===v));
      });
    });
    el.querySelectorAll('[data-comment-key]').forEach(inp=> inp.oninput = ()=>{
      const key = inp.dataset.commentKey, v = inp.value;
      if(v.trim()==='') delete draft.comments[key]; else draft.comments[key] = v;
    });
  }
  const saveBtn = document.getElementById('btnSaveMyRequests');
  if(saveBtn) saveBtn.onclick = ()=>{
    try{
      const aEl=document.getElementById('myTargetAPS'), pEl=document.getElementById('myTargetPCS');
      draft.targetWeeks = {
        APS: person.services.includes('APS') && aEl && aEl.value!=='' ? Number(aEl.value) : null,

      };
      person.blockStatus = {...draft.blockStatus};
      person.targetWeeks = {...draft.targetWeeks};
      state.comments[person.id] = {...draft.comments};
      toast('Your requests were saved.');
      persistPerson(person); // background
      persistComments(person.id, draft.comments); // background
    }catch(e){ toast('Something went wrong saving: '+e.message); console.error(e); }
  };
}
/** Week × staff matrix: every filtered week down the rows, every filtered

function renderRosterCalendar(){

  const ctx = currentViewContext();

  const filteredBlocks = ctx.blocks.filter(b => f.services[b.service] && (!f.holidaysOnly || b.holidayWeek));

  container.innerHTML = `
    <details class="filter-card" id="calFilterDetails" ${f.uiOpen?'open':''}>
      <summary>Filters <span class="filter-count">— ${filteredBlocks.length} week(s) × ${filteredPeople.length} people shown</span></summary>
      <div class="row gap-8" style="flex-wrap:wrap;align-items:flex-start;">

            <label class="checkbox-row"><input type="checkbox" id="calfPCS" ${f.services.PCS?'checked':''}> PCS</label>
          </div>
        </div>
        <div>
          <div class="filter-group-label">Status shown</div>
          <div class="row gap-8">

            <label class="checkbox-row"><input type="checkbox" id="calfReq" ${f.statuses.requested?'checked':''}> Requested</label>
            <label class="checkbox-row"><input type="checkbox" id="calfUnavail" ${f.statuses.unavailable?'checked':''}> Unavailable</label>
          </div>
        </div>
        <div>
          <div class="filter-group-label">Weeks</div>
          <label class="checkbox-row"><input type="checkbox" id="calfHolidays" ${f.holidaysOnly?'checked':''}> Holiday weeks only</label>

    </details>
    <div class="card" style="margin-top:16px;padding:0;">
      ${filteredBlocks.length===0 || filteredPeople.length===0 ? `<div class="empty-state" style="padding:32px;"><strong>Nothing matches these filters</strong>Widen the service or week filters above.</div>` : `
      <div class="cal-grid-wrap">

            ${filteredPeople.map(p=>`<th class="cal-person-head">${esc(p.name)}</th>`).join('')}

            ${filteredBlocks.map(b=>`<tr>
              <td class="cal-week-head">
                <span class="badge badge-${b.service.toLowerCase()}"><span class="badge-dot"></span>${b.service}</span>
                <div class="mono" style="font-size:11.5px;margin-top:3px;color:var(--ink-soft);">${fmtShort(b.start)} – ${fmtShort(b.end)}</div>
                ${b.holidayWeek?'<span class="pill pill-neutral" style="margin-top:3px;display:inline-block;">holiday</span>':''}
              </td>
              ${filteredPeople.map(p=>{
                if(!p.services.includes(b.service)) return `<td class="cal-cell cal-cell-na">—</td>`;
                const st = p.blockStatus[b.key] || 'neutral';
                const shown = f.statuses[st];
                const comment = (ctx.comments[p.id]||{})[b.key];
                const title = `${esc(p.name)} — ${labelFor(st)}${comment?': '+esc(comment):''}`;
                return `<td class="cal-cell cal-cell-${st} ${shown?'':'cal-cell-dim'} ${comment?'comment-marker':''}" ${ctx.editable?`data-person="${p.id}" data-block="${b.key}"`:''} title="${title}">${symbolFor(st)}</td>`;
              }).join('')}

    </div>
  `;
  document.getElementById('calFilterDetails').addEventListener('toggle', e=>{ f.uiOpen = e.target.open; });
  document.getElementById('calfAPS').onchange = e=>{ f.services.APS=e.target.checked; renderRosterCalendar(); };
  document.getElementById('calfPCS').onchange = e=>{ f.services.PCS=e.target.checked; renderRosterCalendar(); };
  document.getElementById('calfAvail').onchange = e=>{ f.statuses.neutral=e.target.checked; renderRosterCalendar(); };
  document.getElementById('calfReq').onchange = e=>{ f.statuses.requested=e.target.checked; renderRosterCalendar(); };
  document.getElementById('calfUnavail').onchange = e=>{ f.statuses.unavailable=e.target.checked; renderRosterCalendar(); };
  document.getElementById('calfHolidays').onchange = e=>{ f.holidaysOnly=e.target.checked; renderRosterCalendar(); };
  if(ctx.editable) container.querySelectorAll('.cal-cell[data-person]').forEach(td=> td.onclick = ()=>{
    const p = state.people.find(x=>x.id===td.dataset.person);

    if(next==='neutral') delete p.blockStatus[key]; else p.blockStatus[key] = next;
    persistPerson(p); // background; never blocks the UI
    renderRosterCalendar();

  });
}

/* ---- Person modal: edits happen on a draft copy; nothing touches
   state.people (or the database) until "Save person" is clicked. ---- */
function openPersonModal(existingPerson){
  state.modal = existingPerson
    ? { mode:'person', isNew:false, id:existingPerson.id, draft: { ...existingPerson, services:[...existingPerson.services], blockStatus:{...existingPerson.blockStatus}, comments:{...(state.comments[existingPerson.id]||{})} }, serviceAttachments:{} }
    : { mode:'person', isNew:true, id:uid(), draft: { ...normalizePerson({ id:uid(), name:'', services:[], targetWeeks:null, restrictToRequested:false, blockStatus:{} }), comments:{} }, serviceAttachments:{} };
  document.getElementById('personModalOverlay').hidden = false;
  document.addEventListener('keydown', onModalKeydown);
  renderModal();
}
function closePersonModal(){
  state.modal = null;
  document.getElementById('personModalOverlay').hidden = true;
  document.removeEventListener('keydown', onModalKeydown);
}
function onModalKeydown(e){
  if(e.key==='Escape'){ closePersonModal(); return; }
  if(state.modal && state.modal.mode==='reviewUploads' && (e.key==='ArrowLeft' || e.key==='ArrowRight')){
    const active = document.activeElement;
    if(active && ['INPUT','TEXTAREA'].includes(active.tagName)) return; // don't hijack typing in the search box
    stepReviewUploads(e.key==='ArrowLeft' ? -1 : 1);
  }
}
function renderModal(){
  if(!state.modal) return;
  document.getElementById('personModalDialog').classList.toggle('modal-wide', state.modal.mode==='reviewUploads');
  if(state.modal.mode==='import') renderImportModal();
  else if(state.modal.mode==='closePeriod') renderClosePeriodModal();
  else if(state.modal.mode==='reviewUploads') renderReviewUploadsModal();
  else if(state.modal.mode==='assignWeek') renderAssignWeekModal();
  else renderPersonModal();
}

  const f = state.personModalFilters;
  const filteredBlocks = relevantBlocks.filter(b=>{

      <div class="field"><label>Eligible for</label>
        <div class="row gap-8" style="padding-top:6px;">
          <label class="checkbox-row"><input type="checkbox" id="pAPS" ${p.services.includes('APS')?'checked':''}> APS</label>
          <label class="checkbox-row"><input type="checkbox" id="pPCS" ${p.services.includes('PCS')?'checked':''}> PCS</label>
        </div>
      </div>
    </div>
    ${p.services.length ? `<div class="grid-2" style="margin-top:12px;">
      ${p.services.includes('APS')?`<div class="field"><label for="pTargetAPS">APS target weeks (optional)</label><input class="input" type="number" id="pTargetAPS" min="0" value="${p.targetWeeks.APS==null?'':p.targetWeeks.APS}"></div>`:''}
      ${p.services.includes('PCS')?`<div class="field"><label for="pTargetPCS">PCS target weeks (optional)</label><input class="input" type="number" id="pTargetPCS" min="0" value="${p.targetWeeks.PCS==null?'':p.targetWeeks.PCS}"></div>`:''}
    </div>` : ''}
    <div class="row" style="margin-top:12px;">
      <label class="checkbox-row"><input type="checkbox" id="pRestrict" ${p.restrictToRequested?'checked':''}> Only ever schedule this person on weeks marked "requested" below</label>
    </div>
    <div class="row between" style="margin-top:16px;align-items:flex-start;border-top:1px dashed var(--line-strong);padding-top:14px;">
      <div>
        <div class="field-label" style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);">Request files</div>
        ${p.services.length ? fileStatusRows : '<div class="hint" style="margin-top:4px;">No file on file yet.</div>'}
        <div class="hint" style="margin-top:6px;max-width:44ch;">One file per service — attaching a PCS file won't touch an already-attached APS file, and vice versa.</div>
      </div>
      <div class="row gap-8">
        <label class="btn btn-sm" style="cursor:pointer;">Attach .xlsx<input type="file" id="pImportFile" accept=".xlsx" style="display:none;"></label>
      </div>
    </div>
    ${relevantBlocks.length ? `
    <details class="filter-card" id="pmFilterDetails" style="margin-top:16px;" ${f.uiOpen?'open':''}>
      <summary>Filters <span class="filter-count">— ${filteredBlocks.length} of ${relevantBlocks.length} week(s) shown</span></summary>
      <div class="row gap-8" style="flex-wrap:wrap;align-items:flex-start;">
        ${p.services.length>1?`<div>
          <div class="filter-group-label">Service</div>
          <div class="row gap-8">
            <label class="checkbox-row"><input type="checkbox" id="pmfAPS" ${f.services.APS?'checked':''}> APS</label>
            <label class="checkbox-row"><input type="checkbox" id="pmfPCS" ${f.services.PCS?'checked':''}> PCS</label>
          </div>
        </div>`:''}
        <div>
          <div class="filter-group-label">Status</div>
          <div class="row gap-8">
            <label class="checkbox-row"><input type="checkbox" id="pmfAvail" ${f.statuses.neutral?'checked':''}> Available</label>
            <label class="checkbox-row"><input type="checkbox" id="pmfReq" ${f.statuses.requested?'checked':''}> Requested</label>
            <label class="checkbox-row"><input type="checkbox" id="pmfUnavail" ${f.statuses.unavailable?'checked':''}> Unavailable</label>
          </div>
        </div>
        <div>
          <div class="filter-group-label">Weeks</div>
          <label class="checkbox-row"><input type="checkbox" id="pmfHolidays" ${f.holidaysOnly?'checked':''}> Holiday weeks only</label>
        </div>
      </div>
    </details>` : ''}
    <div class="editor">
      <div class="row between" style="margin-bottom:8px;">
        <strong style="font-size:13px;">Weeks (${filteredBlocks.length})</strong>
        <span class="hint">Available (default) · Requested · Unavailable</span>
      </div>
      ${relevantBlocks.length===0 ? '<div class="empty-state">Check APS and/or PCS above to see weeks here.</div>' : filteredBlocks.length===0 ? '<div class="empty-state">No weeks match these filters.</div>' : `
      <div class="block-list">
        ${groups.map(g=>`<div class="month-header">${g.label}</div>${g.items.map(b=>{
          const st = p.blockStatus[b.key] || 'neutral';
          const seg = `<div class="segmented" data-key="${b.key}">
            <button class="seg-btn ${st==='neutral'?'active':''}" data-v="neutral">Available</button>
            <button class="seg-btn ${st==='requested'?'active':''}" data-v="requested">Requested</button>
            <button class="seg-btn ${st==='unavailable'?'active':''}" data-v="unavailable">Unavailable</button>
          </div>`;
          return blockRowHtml(b, seg, p.comments[b.key]||'', allUnclearKeys.has(b.key));
        }).join('')}`).join('')}
      </div>`}
    </div>
    <div class="row between" style="margin-top:16px;">
      <button class="btn btn-ghost" id="btnCancelModal">Cancel</button>
      <button class="btn btn-primary" id="btnSavePerson">Save person</button>
    </div>
  `;
  document.getElementById('btnCloseModal').onclick = closePersonModal;
  document.getElementById('btnCancelModal').onclick = closePersonModal;
  // Re-render the weeks list when eligibility checkboxes change, without losing other in-progress field values.
  const syncDraftFields = ()=>{
    p.name = document.getElementById('pName').value;
    // Capture any target value already typed before the checkbox toggle re-renders the fields away.
    const aEl = document.getElementById('pTargetAPS'), pEl = document.getElementById('pTargetPCS');
    if(aEl && aEl.value!=='') p.targetWeeks.APS = Number(aEl.value);
    if(pEl && pEl.value!=='') p.targetWeeks.PCS = Number(pEl.value);
    p.services = [ ...(document.getElementById('pAPS').checked?['APS']:[]), ...(document.getElementById('pPCS').checked?['PCS']:[]) ];
  };
  dialog.querySelector('#pAPS').onchange = ()=>{ syncDraftFields(); renderPersonModal(); };
  dialog.querySelector('#pPCS').onchange = ()=>{ syncDraftFields(); renderPersonModal(); };
  const filterDetails = document.getElementById('pmFilterDetails');
  if(filterDetails){
    filterDetails.addEventListener('toggle', e=>{ f.uiOpen = e.target.open; });
    const bindFilter = (id, apply)=>{ const elm=document.getElementById(id); if(elm) elm.onchange = e=>{ apply(e.target.checked); syncDraftFields(); renderPersonModal(); }; };
    bindFilter('pmfAPS', v=>f.services.APS=v);
    bindFilter('pmfPCS', v=>f.services.PCS=v);
    bindFilter('pmfAvail', v=>f.statuses.neutral=v);
    bindFilter('pmfReq', v=>f.statuses.requested=v);
    bindFilter('pmfUnavail', v=>f.statuses.unavailable=v);
    bindFilter('pmfHolidays', v=>f.holidaysOnly=v);
  }
  dialog.querySelectorAll('.segmented').forEach(seg=>{
    seg.querySelectorAll('.seg-btn').forEach(btn=> btn.onclick = ()=>{
      const key = seg.dataset.key, v = btn.dataset.v;
      if(v==='neutral') delete p.blockStatus[key]; else p.blockStatus[key]=v;
      seg.querySelectorAll('.seg-btn').forEach(b2=>b2.classList.toggle('active', b2.dataset.v===v));
    });
  });
  dialog.querySelectorAll('[data-comment-key]').forEach(inp=> inp.oninput = ()=>{
    const key = inp.dataset.commentKey, v = inp.value;
    if(v.trim()==='') delete p.comments[key]; else p.comments[key] = v;
  });
  document.getElementById('pImportFile').onchange = (e)=>{
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const buf = ev.target.result;
      let wb;
      try{ wb = XLSX.read(buf, {type:'array', cellDates:true}); }
      catch(err){ toast(`Couldn't read ${file.name}: ${err.message}`); return; }
      const parsed = parseRequestWorkbook(wb, file.name.replace(/\.xlsx$/i,'').trim());
      if(parsed.error){ toast(`${file.name}: ${parsed.error}`); return; }
      const svc = parsed.service;
      const tooLarge = buf.byteLength > MAX_UPLOAD_BYTES;
      // Ask before silently replacing a file already on record for this service —
      // only when there's actually a replacement to store (a too-large file can't
      // take its place, so the old one is left alone and there's nothing to confirm).
      const existingUploads = state.uploads.filter(u=>u.personId===p.id && u.service===svc);
      if(!tooLarge && existingUploads.length && !confirm(`${p.name||'This person'} already has a request file on file for ${svc} (${existingUploads[0].filename}). Replace it with ${file.name}?`)){
        toast('Kept the existing file — nothing changed.');
        return;
      }
      syncDraftFields(); // capture any in-progress typed edits before this overwrites and re-renders the form
      // Tracked per service, so an APS file and a PCS file for the same person
      // coexist — attaching one never touches the other's already-applied weeks
      // (nobody covers both services the same week, so the key prefixes never overlap).
      const prefix = svc+'-';
      const before = { blockStatus:{}, target:p.targetWeeks[svc], hadService:p.services.includes(svc) };
      for(const k of Object.keys(p.blockStatus)) if(k.startsWith(prefix)) before.blockStatus[k]=p.blockStatus[k];
      if(!before.hadService) p.services = [...p.services, svc];
      for(const k of Object.keys(p.blockStatus)) if(k.startsWith(prefix)) delete p.blockStatus[k];
      const unclear = [];
      for(const r of parsed.weekRows){
        if(r.guess==='unclear') unclear.push(r.block.key);
        else if(r.guess!=='neutral') p.blockStatus[r.block.key] = r.guess;
      }
      if(parsed.targetGuess!=null) p.targetWeeks[svc] = parsed.targetGuess;
      m.serviceAttachments[svc] = { filename:file.name, size:buf.byteLength, base64: tooLarge?null:arrayBufferToBase64(buf), tooLarge, unclearKeys:unclear, before,
        replaceUploadIds: existingUploads.map(u=>u.id) };
      toast(`Applied ${file.name} (${svc})${unclear.length?` — ${unclear.length} week(s) need review (highlighted below)`:''}. Save to keep it.`);
      renderPersonModal();
    };
    reader.readAsArrayBuffer(file);
  };
  dialog.querySelectorAll('[data-undo-service]').forEach(btn=> btn.onclick = ()=>{
    const svc = btn.dataset.undoService;
    const att = m.serviceAttachments[svc];
    if(!att) return;
    const prefix = svc+'-';
    for(const k of Object.keys(p.blockStatus)) if(k.startsWith(prefix)) delete p.blockStatus[k];
    Object.assign(p.blockStatus, att.before.blockStatus);
    p.targetWeeks[svc] = att.before.target;
    if(!att.before.hadService) p.services = p.services.filter(s=>s!==svc);
    delete m.serviceAttachments[svc];
    toast('Reverted.');
    renderPersonModal();
  });
  document.getElementById('btnSavePerson').onclick = ()=>{
    try{
      p.name = document.getElementById('pName').value.trim() || 'Unnamed';
      p.email = document.getElementById('pEmail').value.trim().toLowerCase();
      p.services = [ ...(document.getElementById('pAPS').checked?['APS']:[]), ...(document.getElementById('pPCS').checked?['PCS']:[]) ];
      const aEl = document.getElementById('pTargetAPS'), pEl = document.getElementById('pTargetPCS');
      p.targetWeeks = {
        APS: (p.services.includes('APS') && aEl && aEl.value!=='') ? Number(aEl.value) : null,
        PCS: (p.services.includes('PCS') && pEl && pEl.value!=='') ? Number(pEl.value) : null
      };
      p.restrictToRequested = document.getElementById('pRestrict').checked;
      if(p.restrictToRequested && !Object.values(p.blockStatus).includes('requested')){
        toast('Note: "requested weeks only" is on but no weeks are marked requested — this person won\'t be scheduled.');
      }
      const comments = p.comments; // kept in personComments/, not on the people doc itself
      const personDoc = {...p}; delete personDoc.comments;
      if(m.isNew){ state.people.push(personDoc); }
      else{ const idx = state.people.findIndex(x=>x.id===m.id); if(idx>=0) state.people[idx]=personDoc; }
      state.comments[personDoc.id] = {...comments};
      persistPerson(personDoc); // background; never blocks the UI
      persistComments(personDoc.id, comments); // background; never blocks the UI
      // Each attached service's file (if any) is retained independently — a
      // person on both APS and PCS gets both saved in the same click.
      const kept = [], skipped = [];
      for(const [svc, att] of Object.entries(m.serviceAttachments)){
        if(att.base64){
          for(const oldId of (att.replaceUploadIds||[])){ state.uploads = state.uploads.filter(u=>u.id!==oldId); persistDeleteUpload(oldId); } // background
          const uploadId = uid();
          const uploadDoc = { personId:personDoc.id, personName:personDoc.name, filename:att.filename, service:svc,
            uploadedAt:new Date().toISOString(), uploadedBy:myEmail(), size:att.size, data:att.base64 };
          state.uploads.unshift({ id:uploadId, ...uploadDoc });
          persistUpload(uploadId, uploadDoc); // background
          kept.push(att.filename);
        } else if(att.tooLarge){
          skipped.push(`${att.filename} (${prettyBytes(att.size)})`);
        }
      }
      let msg = 'Person saved.';
      if(kept.length) msg += ` ${kept.length} request file${kept.length>1?'s':''} attached.`;
      if(skipped.length) msg += ` Couldn't keep a copy of ${skipped.join(', ')} — over the ${prettyBytes(MAX_UPLOAD_BYTES)} limit.`;
      toast(msg);
      closePersonModal();
      renderPeopleList();
    }catch(e){ toast('Something went wrong saving: '+e.message); console.error(e); }
  };
}

/* ---- Close-period modal: archives the ending period, then resets the live
   data for the one starting. Shares the person-modal overlay/dialog. ---- */
function openClosePeriodModal(){
  const c = state.config;
  const curStart = parseDateInput(c.startDate), curEnd = parseDateInput(c.endDate);
  let newStart = c.endDate||'', newEnd = c.endDate||'';
  if(curEnd){
    const ns = addDays(curEnd,1);
    newStart = isoDate(ns);
    newEnd = curStart ? isoDate(addDays(ns, Math.round((curEnd-curStart)/86400000))) : newStart;
  }
  state.modal = { mode:'closePeriod', endingLabel: c.periodLabel || `${c.startDate||'?'} to ${c.endDate||'?'}`, newLabel:'', newStart, newEnd };
  document.getElementById('personModalOverlay').hidden = false;
  document.addEventListener('keydown', onModalKeydown);
  renderModal();
}
function renderClosePeriodModal(){
  const dialog = document.getElementById('personModalDialog');
  const m = state.modal;
  dialog.innerHTML = `
    <div class="row between" style="margin-bottom:14px;">
      <h2>Close this period &amp; start a new one</h2>
      <button class="btn btn-ghost btn-sm" id="btnCloseModal">✕</button>
    </div>
    <div class="desc">Archives the current period's roster, requests, comments, and schedule as read-only history (browsable from the period selector), then clears everyone's availability and comments for the new window. Target-week counts and "requested weeks only" carry over unchanged. This can't be undone from the app.</div>
    <div class="field" style="margin-top:12px;"><label for="cpEndingLabel">Label for the period ending</label><input class="input" id="cpEndingLabel" value="${esc(m.endingLabel)}"></div>
    <div class="grid-3" style="margin-top:12px;">
      <div class="field"><label for="cpNewStart">New start date</label><input class="input" type="date" id="cpNewStart" value="${m.newStart||''}"></div>
      <div class="field"><label for="cpNewEnd">New end date</label><input class="input" type="date" id="cpNewEnd" value="${m.newEnd||''}"></div>
      <div class="field"><label for="cpNewLabel">Label for the new period</label><input class="input" id="cpNewLabel" placeholder="e.g. Fall 2026" value="${esc(m.newLabel)}"></div>
    </div>
    <div class="row between" style="margin-top:16px;">
      <button class="btn btn-ghost" id="btnCancelModal">Cancel</button>
      <button class="btn btn-danger" id="btnConfirmClosePeriod">Archive &amp; start new period</button>
    </div>
  `;
  document.getElementById('btnCloseModal').onclick = closePersonModal;
  document.getElementById('btnCancelModal').onclick = closePersonModal;
  document.getElementById('btnConfirmClosePeriod').onclick = async ()=>{
    const btn = document.getElementById('btnConfirmClosePeriod');
    const endingLabel = document.getElementById('cpEndingLabel').value.trim();
    const newStart = document.getElementById('cpNewStart').value;
    const newEnd = document.getElementById('cpNewEnd').value;
    const newLabel = document.getElementById('cpNewLabel').value.trim();
    if(!newStart || !newEnd || parseDateInput(newEnd) < parseDateInput(newStart)){ toast('Pick a valid new start and end date.'); return; }
    if(!confirm(`Archive "${endingLabel}" and start a new period from ${newStart} to ${newEnd}?`)) return;
    btn.disabled = true; btn.textContent = 'Archiving…';
    try{
      await persistClosePeriod(endingLabel, newStart, newEnd, newLabel);
      await loadPeriodsArchive();
      rebuildBlocks();
      closePersonModal();
      renderAll();
      toast('Period archived — new period started.');
    }catch(e){ toast('Something went wrong: '+e.message); console.error(e); btn.disabled=false; btn.textContent='Archive & start new period'; }
  };
}

/* ---- Review uploads: browse retained .xlsx copies with fluid prev/next
   navigation. Shares the person-modal overlay/dialog (widened via
   .modal-wide, toggled in renderModal()). opts.personId pre-filters to one
   person's uploads (used by their "View .xlsx" button); omit to browse
   everything. ---- */
function openReviewUploadsModal(opts){
  state.modal = { mode:'reviewUploads', filterPersonId:(opts&&opts.personId)||null, query:'', selectedId:null };
  document.getElementById('personModalOverlay').hidden = false;
  document.addEventListener('keydown', onModalKeydown);
  renderModal();
}
/** state.uploads is kept sorted newest-first (see loadUploads/the import
 * save handler), so a filtered slice of it stays newest-first too. */
function filteredUploadsList(filterPersonId, query){
  const q = (query||'').trim().toLowerCase();
  return state.uploads.filter(u=>{
    if(filterPersonId && u.personId!==filterPersonId) return false;
    if(q && !(u.personName.toLowerCase().includes(q) || u.filename.toLowerCase().includes(q))) return false;
    return true;
  });
}
function stepReviewUploads(delta){
  const m = state.modal;
  if(!m || m.mode!=='reviewUploads') return;
  const list = filteredUploadsList(m.filterPersonId, m.query);
  if(list.length===0) return;
  const idx = list.findIndex(u=>u.id===m.selectedId);
  m.selectedId = list[idx<0 ? 0 : (idx+delta+list.length)%list.length].id;
  refreshUploadsBody();
}
function renderXlsxPreviewHtml(u){
  try{
    const wb = XLSX.read(base64ToArrayBuffer(u.data), {type:'array', cellDates:true});
    return XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[0]], {header:'', footer:''}); // bare <table> — sheet_to_html's default wraps a whole <html><body>, invalid dropped straight into a div
  }catch(e){ return `<div class="empty-state">Couldn't render this file: ${esc(e.message)}</div>`; }
}
function renderReviewUploadsModal(){
  const dialog = document.getElementById('personModalDialog');
  const m = state.modal;
  dialog.innerHTML = `
    <div class="row between" style="margin-bottom:14px;">
      <h2>Review uploads</h2>
      <button class="btn btn-ghost btn-sm" id="btnCloseModal">✕</button>
    </div>
    <div class="row gap-8" style="margin-bottom:12px;flex-wrap:wrap;">
      <input class="input" type="text" id="ruQuery" placeholder="Search name or filename…" value="${esc(m.query)}" style="max-width:260px;">
      <span id="ruPersonChip"></span>
      <span class="hint" id="ruCount"></span>
    </div>
    <div id="ruBody"></div>
  `;
  document.getElementById('btnCloseModal').onclick = closePersonModal;
  // Refreshes only the list/detail below, never the search input itself —
  // re-rendering that on every keystroke would steal focus and cursor position.
  document.getElementById('ruQuery').oninput = e=>{ m.query = e.target.value; refreshUploadsBody(); };
  refreshUploadsBody();
}
function refreshUploadsBody(){
  const m = state.modal;
  if(!m || m.mode!=='reviewUploads') return;
  const list = filteredUploadsList(m.filterPersonId, m.query);
  if(!list.some(u=>u.id===m.selectedId)) m.selectedId = list.length ? list[0].id : null;
  const selected = list.find(u=>u.id===m.selectedId) || null;
  const filterPerson = m.filterPersonId ? state.people.find(p=>p.id===m.filterPersonId) : null;
  const idx = selected ? list.findIndex(u=>u.id===selected.id) : -1;

  document.getElementById('ruPersonChip').innerHTML = filterPerson
    ? `<span class="chip" style="display:inline-flex;align-items:center;gap:6px;">Filtering: ${esc(filterPerson.name)} <button class="btn-ghost" id="btnClearPersonFilter" style="border:none;background:none;cursor:pointer;color:var(--bad);font-family:inherit;">✕</button></span>`
    : '';
  document.getElementById('ruCount').textContent = `${list.length} file(s)${list.length>1?' — use ← / → to browse':''}`;
  const clearBtn = document.getElementById('btnClearPersonFilter');
  if(clearBtn) clearBtn.onclick = ()=>{ m.filterPersonId = null; refreshUploadsBody(); };

  const body = document.getElementById('ruBody');
  if(list.length===0){
    body.innerHTML = `<div class="empty-state"><strong>No uploads${filterPerson||m.query?' match this filter':' yet'}</strong>${filterPerson||m.query?'':'Imported request files are kept here until this period is closed.'}</div>`;
    return;
  }
  body.innerHTML = `
    <div class="uploads-layout">
      <div class="uploads-list">
        ${list.map(u=>`<button class="upload-row ${selected&&u.id===selected.id?'active':''}" data-upload-id="${u.id}">
          <div class="name">${esc(u.personName)}</div>
          <div class="meta"><span class="badge badge-${u.service.toLowerCase()}" style="padding:1px 6px;"><span class="badge-dot"></span>${u.service}</span> ${esc(u.filename)}</div>
          <div class="meta">${esc(new Date(u.uploadedAt).toLocaleString())} · ${prettyBytes(u.size||0)}</div>
        </button>`).join('')}
      </div>
      <div class="uploads-detail">
        ${selected?`
        <div class="row between" style="margin-bottom:10px;flex-wrap:wrap;gap:8px;">
          <div>
            <strong>${esc(selected.filename)}</strong>
            <div class="hint">${esc(selected.personName)} · uploaded ${esc(new Date(selected.uploadedAt).toLocaleString())} by ${esc(selected.uploadedBy||'—')}${list.length>1?` · ${idx+1} of ${list.length}`:''}</div>
          </div>
          <div class="row gap-8">
            <button class="btn btn-sm" id="btnPrevUpload" ${list.length<2?'disabled':''}>← Prev</button>
            <button class="btn btn-sm" id="btnNextUpload" ${list.length<2?'disabled':''}>Next →</button>
            <button class="btn btn-sm btn-ghost" id="btnDownloadUpload">Download</button>
            <button class="btn btn-sm btn-danger" id="btnDeleteUpload">Delete</button>
          </div>
        </div>
        <div class="xlsx-preview">${renderXlsxPreviewHtml(selected)}</div>
        `:''}
      </div>
    </div>`;
  body.querySelectorAll('[data-upload-id]').forEach(btn=> btn.onclick = ()=>{ m.selectedId = btn.dataset.uploadId; refreshUploadsBody(); });
  const prevBtn = document.getElementById('btnPrevUpload'); if(prevBtn) prevBtn.onclick = ()=> stepReviewUploads(-1);
  const nextBtn = document.getElementById('btnNextUpload'); if(nextBtn) nextBtn.onclick = ()=> stepReviewUploads(1);
  const dlBtn = document.getElementById('btnDownloadUpload');
  if(dlBtn) dlBtn.onclick = ()=> downloadBlob(new Blob([base64ToArrayBuffer(selected.data)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), selected.filename);
  const delBtn = document.getElementById('btnDeleteUpload');
  if(delBtn) delBtn.onclick = ()=>{
    if(!confirm(`Delete this retained copy of ${selected.filename}? This can't be undone.`)) return;
    state.uploads = state.uploads.filter(u=>u.id!==selected.id);
    persistDeleteUpload(selected.id); // background
    refreshUploadsBody();
  };
}

/* ---------------------------------------------------------------------
   IMPORT / EXPORT
--------------------------------------------------------------------- */
async function exportRosterXlsx(){
  if(typeof XLSX==='undefined'){ toast('Spreadsheet library failed to load — try again in a moment.'); return; }
  const header = ['Name','Services (APS / PCS / APS,PCS)','APS Target Weeks','PCS Target Weeks','Restrict To Requested (Y/N)','Requested Weeks (block keys, separated by ;)','Unavailable Weeks (block keys, separated by ;)'];
  const rows = [header];
  for(const p of state.people){
    const req = Object.entries(p.blockStatus).filter(([,v])=>v==='requested').map(([k])=>k).join('; ');
    const unavail = Object.entries(p.blockStatus).filter(([,v])=>v==='unavailable').map(([k])=>k).join('; ');
    rows.push([p.name, p.services.join(','), p.targetWeeks.APS==null?'':p.targetWeeks.APS, p.targetWeeks.PCS==null?'':p.targetWeeks.PCS, p.restrictToRequested?'Y':'N', req, unavail]);
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:20},{wch:22},{wch:14},{wch:14},{wch:16},{wch:40},{wch:40}];
